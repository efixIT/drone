<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFix Drone Operations - Essex School Fullscreen Viewer</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        /* Reset and lock the body to prevent page scrolling */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Full-height container flexbox layout */
        .efix-fullscreen-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
        }

        /* Branding header at the top */
        .efix-header {
            padding: 14px 24px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181818;
            flex-shrink: 0; /* Prevents the header from shrinking */
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* Clickable logo styling */
        .efix-logo {
            display: block;
            text-decoration: none;
            transition: filter 0.2s ease;
        }

        .efix-logo:hover {
            filter: brightness(1.15);
        }

        .efix-logo img {
            height: 39px;
            width: auto;
            display: block;
        }

        /* Clickable text metadata styling */
        .efix-meta {
            display: block;
            text-decoration: none;
            text-align: right;
            transition: opacity 0.2s ease;
        }

        .efix-meta:hover {
            opacity: 0.8;
        }

        .efix-title {
            font-size: 0.85rem;
            color: #eee;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 3px;
        }

        .efix-credit {
            font-size: 0.75rem;
            color: #888;
            font-weight: 400;
            line-height: 1.2;
            transition: color 0.2s ease;
        }

        /* Subtle cyan accent glow on hover */
        .efix-meta:hover .efix-credit {
            color: #00bcd4;
        }

        /* Immersive full-screen 3D viewport */
        .efix-viewport {
            flex-grow: 1; /* Automatically stretches to take up remaining window height */
            width: 100%;
            background: #050505;
            position: relative;
        }

        .efix-viewport iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="efix-fullscreen-container">
        <!-- Locked top header -->
        <header class="efix-header">
            <a class="efix-logo" href="https://efixdroneops.co.uk" target="_blank" rel="noopener">
                <img src="https://view.efixdroneops.co.uk/efix-logo-white-transparent.png" alt="eFix Drone Operations Logo">
            </a>
            <a class="efix-meta" href="https://efixdroneops.co.uk" target="_blank" rel="noopener">
                <div class="efix-title">School Building</div>
                <div class="efix-credit">imagery by efixdroneops.co.uk</div>
            </a>
        </header>

        <!-- Immersive viewer iframe -->
        <main class="efix-viewport">
            <iframe 
                src="https://imagery.efixdroneops.co.uk/r/market-field/may-lidar-2026/view/dGVycmFfbGF6L2Nsb3VkX21lcmdlZC5sYXo=/pointcloud?embed=1" 
                loading="lazy"
                allowfullscreen
                allow="fullscreen; xr-spatial-tracking">
            </iframe>
        </main>
    </div>

</body>
</html>
